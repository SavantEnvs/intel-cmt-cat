name: diag
on:
  push:
    branches: [diag-ci]
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: build and annotate
        run: |
          set +e
          docker build -q -f mayhem/Dockerfile --build-arg COMMIT=x --build-arg REPO_URL=x -t diag:t . > /dev/null 2>&1
          printf 'FROM diag:t\nRUN for i in $(seq 1 40); do bash mayhem/test.sh > /tmp/o.$i 2>&1 && echo ok $i || { echo FAIL $i; tail -60 /tmp/o.$i; }; done; true\n' > Dockerfile.diag
          docker build --no-cache --progress=plain -f Dockerfile.diag . > loop.log 2>&1
          docker run --rm diag:t bash -c 'for i in $(seq 1 40); do bash mayhem/test.sh > /tmp/o.$i 2>&1 && echo ok $i || { echo FAIL $i; tail -60 /tmp/o.$i; }; done' > run.log 2>&1
          { echo BUILDLOOP; grep -c " ok " loop.log; grep -A60 FAIL loop.log | head -150; echo RUNLOOP; grep -c "^ok" run.log; grep -A60 FAIL run.log | head -150; } > ann.txt
          python3 - <<'PY'
          s=open('ann.txt',errors='replace').read()
          for i in range(0,len(s),3500):
              c=s[i:i+3500].replace('%','%25').replace('\r','%0D').replace('\n','%0A')
              print('::warning title=diag%d::%s'%(i//3500,c))
          PY
